name: publish-crate

# Publish the `munin-msbuild` crate to crates.io.
#
# Trigger:
#   - Pushing a tag matching `v*` (e.g. `v0.1.3`); created automatically by
#     release-please when the Release PR is merged.
#   - `workflow_dispatch` for manual rehearsal (publish step still gated).
#
# Gating:
#   - The `publish` job uses `environment: crates-io`. That GitHub
#     environment is configured (one-time, by the operator) with
#     `MikeGrier` as a required reviewer and `CARGO_REGISTRY_TOKEN` set
#     to a crates.io API token scoped to the `munin-msbuild` crate. The publish
#     step blocks on approval.
#
# Why a separate job for dry-run?
#   - `cargo publish --dry-run` packages the crate, verifies the build
#     from the packaged tarball, and catches metadata problems (missing
#     license, dirty git tree, etc.) without needing the registry token
#     or human approval. Failing fast here saves a needless approval
#     prompt when the crate would have been rejected anyway.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Opt every JavaScript-action step into the Node.js 24 runtime ahead of
# GitHub's June 2, 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dry-run:
    name: cargo publish --dry-run (munin-msbuild)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate-munin-msbuild

      - name: Read workspace version
        id: workspace-version
        uses: ./.github/actions/workspace-version

      - name: Cross-check tag vs Cargo version
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.workspace-version.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            if [ "$tag_ver" != "$ver" ]; then
              echo "Tag '${{ github.ref_name }}' implies version '$tag_ver' but Cargo.toml has '$ver'." >&2
              echo "Update [workspace.package] version in the root Cargo.toml (or rerun release-please), retag, and try again." >&2
              exit 1
            fi
          fi

      - name: cargo publish --dry-run -p munin-msbuild
        run: cargo publish -p munin-msbuild --locked --dry-run

  publish:
    name: cargo publish (munin-msbuild)
    needs: dry-run
    runs-on: ubuntu-latest
    # `crates-io` is a GitHub Actions environment with `MikeGrier` as a
    # required reviewer and `CARGO_REGISTRY_TOKEN` configured as a
    # secret. The job pauses here until a maintainer approves it.
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate-munin-msbuild

      - name: cargo publish -p munin-msbuild
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p munin-msbuild --locked
