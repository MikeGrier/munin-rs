# Keep GitHub Actions, Cargo, and the VS Code extension's npm deps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # dtolnay/rust-toolchain's versioned tags are Rust toolchain names
    # (e.g. @1.85.0 installs Rust 1.85.0), not action versions. Dependabot
    # treats them as semver action releases and bumps to nonexistent Rust
    # versions. Pin to @stable + `with: toolchain:` and ignore here.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: "/crates/munin-binlog-mcp/extension"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
