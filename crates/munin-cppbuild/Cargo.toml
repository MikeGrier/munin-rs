[package]
name          = "munin-cppbuild"
description   = "Derive structured C/C++ build data (sources, includes, link inputs) from MSBuild .binlog files."
keywords      = ["msbuild", "binlog", "cpp", "build", "analysis"]
categories    = ["parser-implementations", "development-tools"]
readme        = "README.md"
exclude       = ["tests/data/*", "CHECKLIST.md", "COMPLETED-CHECKLIST.md", "DESIGN-NOTES.md"]
version.workspace       = true
authors.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true

[dependencies]
munin-msbuild = { path = "../munin-msbuild", version = "0.4.0" } # x-release-please-version
serde       = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
